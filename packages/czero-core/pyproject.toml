[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "czero-core"
version = "0.1.0"
description = "Reusable runtime services for C0 applications"
requires-python = ">=3.12,<3.15"
license = "GPL-3.0-or-later"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
