[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "czero-core"
version = "0.6.1"
description = "Reusable runtime services for C0 applications"
requires-python = ">=3.12,<3.15"
license = "GPL-3.0-or-later"
dependencies = ["SQLAlchemy==2.1.4", "alembic==1.20.0", "psycopg[binary]==3.3.6", "joserfc==1.7.5", "Authlib==1.8.0", "httpx2==2.13.1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
