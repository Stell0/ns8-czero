name: Core Renovate rules
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      source:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  versioning:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
      - run: npm install --ignore-scripts --prefix /tmp/czero-renovate renovate@44.161.0
      - run: node tests/development/core-renovate.mjs
        env:
          RENOVATE_PACKAGE_ROOT: /tmp/czero-renovate/node_modules/renovate
