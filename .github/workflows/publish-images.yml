name: "Publish images"

on:
  push:
    branches-ignore: ["apidoc-**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: read
  security-events: write

jobs:
  publish-images:
    # Adapted from NethServer/ns8-github-actions publish-branch.yml (GPL-3.0).
    # Its packages-only permission block prevents private-repository checkout.
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: true
    env:
      REPOBASE: ghcr.io/${{ github.repository_owner }}
      BRANCH_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ui/node_modules
          key: yarn-${{ hashFiles('ui/yarn.lock') }}
      - id: build
        run: |
          export REPOBASE="${REPOBASE,,}"
          export IMAGETAG="${BRANCH_TAG//\//-}"
          echo "IMAGETAG=${IMAGETAG}" >> "$GITHUB_ENV"
          bash build-images.sh
      - name: Validate application runtime contents
        run: |
          podman run --rm --interactive --entrypoint python \
            "${REPOBASE,,}/czero-app:${IMAGETAG}" - < tests/audit_runtime.py
      - name: Validate database runtime contents
        run: |
          podman run --rm --entrypoint sh "${REPOBASE,,}/czero-postgres:${IMAGETAG}" -ec '
            test "$(id -u)" -gt 0
            test -f /usr/lib/postgresql/17/lib/vector.so
            test ! -e /usr/lib/postgresql/17/lib/pgxs
            ! command -v gcc
            ! command -v make
          '
      - name: Publish module images
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          IMAGES: ${{ steps.build.outputs.images }}
        run: |
          set -euo pipefail
          trap 'buildah logout ghcr.io >/dev/null 2>&1 || :' EXIT
          buildah login -u "$REGISTRY_USER" --password-stdin ghcr.io <<<"$REGISTRY_TOKEN"
          for image in $IMAGES; do
            buildah push "$image" "docker://${image}:${IMAGETAG}"
            if [[ "$IMAGETAG" == main || "$IMAGETAG" == master ]]; then
              buildah push "$image" "docker://${image}:latest"
            fi
          done
  module:
    needs: publish-images
    # Unlike upstream module-info, fail on a pull error and support private GHCR.
    runs-on: ubuntu-26.04
    permissions:
      packages: read
    outputs:
      images: ${{ steps.images.outputs.list }}
    steps:
      - id: images
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          REPOBASE: ghcr.io/${{ github.repository_owner }}
          BRANCH_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          trap 'podman logout ghcr.io' EXIT
          podman login -u "$REGISTRY_USER" --password-stdin ghcr.io <<<"$REGISTRY_TOKEN"
          tag="${BRANCH_TAG//\//-}"
          image="${REPOBASE,,}/czero:${tag}"
          podman pull "$image"
          dependencies=$(podman image inspect "$image" -f '{{index .Config.Labels "org.nethserver.images"}}')
          list=$(jq -cn --arg deps "$dependencies" --arg image "$image" '($deps | split(" ") | map(select(length > 0))) + [$image]')
          echo "list=${list}" >> "$GITHUB_OUTPUT"
  trivy:
    needs: module
    # Same Trivy/SBOM operations as upstream, without optional paid SARIF ingest.
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.module.outputs.images) }}
        include:
          - target: ui
            scan_type: fs
          - target: imageroot
            scan_type: fs
    steps:
      - uses: actions/checkout@v7
      - name: Scan vulnerabilities and secrets
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          scan-type: ${{ matrix.scan_type || 'image' }}
          scan-ref: ${{ matrix.target }}
          image-ref: ${{ matrix.target }}
          format: sarif
          output: trivy-results.sarif
      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          scan-type: ${{ matrix.scan_type || 'image' }}
          scan-ref: ${{ matrix.target }}
          image-ref: ${{ matrix.target }}
          format: cyclonedx
          output: sbom.cdx.json
      - name: Name report artifact
        id: artifact
        env:
          TARGET: ${{ matrix.target }}
        run: echo "name=$(printf '%s' "$TARGET" | tr -c 'a-zA-Z0-9' '-')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: trivy-${{ steps.artifact.outputs.name }}
          path: |
            trivy-results.sarif
            sbom.cdx.json
