name: Local checks
on:
  push:
    branches-ignore: ["apidoc-**"]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    # This isolated CI service uses no reusable password and exposes only runner loopback.
    services:
      postgres:
        image: docker.io/pgvector/pgvector:0.8.7-pg17-bookworm@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_USER: czero
          POSTGRES_DB: czero_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - "127.0.0.1:5432:5432"
        options: >-
          --health-cmd="pg_isready -U czero -d czero_test"
          --health-interval=5s --health-timeout=5s --health-retries=15
    env:
      CZERO_TEST_DATABASE_URL: postgresql+psycopg://czero@127.0.0.1:5432/czero_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pytest robotframework robotframework-sshlibrary -e packages/czero-core -e 'app[test]'
      - run: python -m pytest -q app/tests packages/czero-core/tests tests/unit tests/integration
      - run: go run tests/check_schemas.go
      - run: bash -n build-images.sh imageroot/actions/configure-module/80start_services imageroot/update-module.d/80restart
      - run: robot --dryrun --exclude ui -v NODE_ADDR:disposable.invalid -v IMAGE_URL:ghcr.io/stell0/czero:main -d /tmp/robot-dryrun tests
