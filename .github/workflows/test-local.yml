name: Local checks
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      source:
        type: string
        default: ''
      feedback:
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    # This isolated CI service uses no reusable password and exposes only runner loopback.
    services:
      postgres:
        image: docker.io/pgvector/pgvector:0.8.7-pg17-bookworm@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_USER: czero
          POSTGRES_DB: czero_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - "127.0.0.1:5432:5432"
        options: >-
          --health-cmd="pg_isready -U czero -d czero_test"
          --health-interval=5s --health-timeout=5s --health-retries=15
    env:
      CZERO_TEST_DATABASE_URL: postgresql+psycopg://czero@127.0.0.1:5432/czero_test
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source || github.sha }}
          persist-credentials: false
      - name: Verify exact checkout
        env:
          SOURCE: ${{ inputs.source || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE"
      - uses: actions/download-artifact@v8
        if: inputs.feedback
        with:
          name: ci-selection
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            app/pyproject.toml
            packages/czero-core/pyproject.toml
            tests/e2e/requirements.txt
      - name: Install explicit producer development environment
        run: |
          pip install uv==0.12.20
          python -c "import tomllib; print('czero-core=='+tomllib.load(open('packages/czero-core/pyproject.toml','rb'))['project']['version'])" > /tmp/c0-producer-requirement.txt
          uv pip install --system --override /tmp/c0-producer-requirement.txt pytest robotframework robotframework-sshlibrary -e packages/czero-core -e 'app[test]' -e samples/ingestion
      - uses: actions/setup-node@v6
        with:
          node-version: "24.21.0"
      - if: inputs.feedback
        run: python scripts/run-ci-feedback.py ci-selection.json
      - if: ${{ !inputs.feedback }}
        run: python -m pytest -q app/tests packages/czero-core/tests tests/unit tests/integration tests/packaging
      - name: Install pinned disposable browser
        run: |
          pip install -r tests/e2e/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Full document browser acceptance
        env:
          CZERO_BROWSER_ARTIFACTS: /tmp/c0-document-browser-failures
        run: python -m pytest -q --tb=short -rA tests/e2e
      - name: Retain sanitized browser failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: document-browser-failures
          path: /tmp/c0-document-browser-failures/
          if-no-files-found: ignore
      - run: node --test tests/ui/*.cjs
        if: ${{ !inputs.feedback }}
      - run: go run tests/check_schemas.go
        if: ${{ !inputs.feedback }}
      - run: |
          for script in build-images.sh imageroot/actions/configure-module/80start_services imageroot/actions/create-module/40scheduler imageroot/update-module.d/60scheduler imageroot/update-module.d/80restart; do
            bash -n "$script"
          done
        if: ${{ !inputs.feedback }}
      - run: robot --dryrun --exclude ui -v NODE_ADDR:disposable.invalid -v IMAGE_URL:ghcr.io/stell0/czero:main -d /tmp/robot-dryrun tests
        if: ${{ !inputs.feedback }}
