name: Publish C0 Core

# Core library artifacts use their own namespace, separate from NS8 module tags.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable Core tag to publish without moving it
        required: true
        type: string
  push:
    tags: ["core-v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      statuses: read
      actions: read
    services:
      postgres:
        image: docker.io/pgvector/pgvector:0.8.7-pg17-bookworm@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_USER: czero
          POSTGRES_DB: czero_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["127.0.0.1:5432:5432"]
        options: >-
          --health-cmd="pg_isready -U czero -d czero_test"
          --health-interval=5s --health-timeout=5s --health-retries=15
    outputs:
      source: ${{ steps.source.outputs.source }}
      tag: ${{ steps.source.outputs.tag }}
    env:
      CORE_TAG: ${{ inputs.tag || github.ref_name }}
      CZERO_TEST_DATABASE_URL: postgresql+psycopg://czero@127.0.0.1:5432/czero_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Select immutable source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          assert re.fullmatch(r'core-v[0-9]+\.[0-9]+\.[0-9]+', os.environ['CORE_TAG']), 'Invalid Core tag'
          PY
          source=$(git rev-parse HEAD)
          tag_source=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${CORE_TAG}" --jq .sha)
          test "$source" = "$tag_source"
          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "tag=$CORE_TAG" >> "$GITHUB_OUTPUT"
      - name: Require verified source and matching version
        env:
          GH_TOKEN: ${{ github.token }}
          CORE_SOURCE: ${{ steps.source.outputs.source }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/commits/${CORE_SOURCE}/status" > /tmp/core-native-status.json
          python scripts/verify-promotion.py --source "$CORE_SOURCE" --full --output /tmp/core-acceptance.json
          python - <<'PY' > /tmp/core-local-runs.json
          import json
          from pathlib import Path
          proof=json.loads(Path('/tmp/core-acceptance.json').read_text())
          print(json.dumps([{'headSha':proof['source'],'status':'completed',
              'conclusion':'success','full_validation':proof['mode']=='full'}]))
          PY
          env GITHUB_SHA="$CORE_SOURCE" GITHUB_REF_NAME="$CORE_TAG" python scripts/check-core-release.py /tmp/core-native-status.json /tmp/core-local-runs.json
      - name: Install acceptance parser runtime
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-eng tesseract-ocr-ita fonts-dejavu-core
      - name: Build independent distributions
        run: |
          set -euo pipefail
          pip install uv==0.12.20 pytest -e packages/czero-core
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD) \
            uv build --no-sources packages/czero-core --out-dir dist/core
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD) \
            python scripts/normalize-core-sdist.py dist/core/*.tar.gz
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD) \
            uv build --no-sources --wheel dist/core/*.tar.gz --out-dir dist/core
      - name: Verify exact artifacts and packaged migrations
        env:
          CZERO_CORE_DISTRIBUTION_DIR: ${{ github.workspace }}/dist/core
        run: python -m pytest -q tests/packaging
      - name: Record distribution checksums
        run: |
          cd dist/core
          sha256sum ./*.whl ./*.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: core-distributions
          path: dist/core/
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name core-distributions --dir dist
      - name: Publish immutable Core artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          CORE_SOURCE: ${{ needs.verify.outputs.source }}
          CORE_TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          tag_commit=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${CORE_TAG}" --jq .sha)
          test "$tag_commit" = "$CORE_SOURCE"
          cd dist
          sha256sum --check SHA256SUMS
          if ! gh release view "$CORE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            python - <<'PY'
          import os
          from pathlib import Path
          Path('release-notes.md').write_text(
              'Independent C0 Core Python library distribution. This is not an NS8 module release.\n\n'
              'Source commit: ' + os.environ['CORE_SOURCE'] + '\n\n'
              'Wheel, source archive and SHA256SUMS are attached. GPL-3.0-or-later license and migrations are included. '
              'See packages/czero-core/README.md at this tag for installation and compatibility.\n')
          PY
            gh release create "$CORE_TAG" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --target "$CORE_SOURCE" --draft --latest=false \
              --title "C0 Core ${CORE_TAG#core-v}" --notes-file release-notes.md \
              ./*.whl ./*.tar.gz SHA256SUMS
          fi
          # Never clobber a version. Replays must match every published byte.
          gh release download "$CORE_TAG" --repo "$GITHUB_REPOSITORY" --dir ../published
          cmp SHA256SUMS ../published/SHA256SUMS
          (cd ../published && sha256sum --check SHA256SUMS)
          if [[ $(gh release view "$CORE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft) == true ]]; then
            gh release edit "$CORE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
          fi
