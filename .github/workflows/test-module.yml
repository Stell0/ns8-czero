name: Test module
on:
  workflow_dispatch:
    inputs:
      source:
        description: Exact tested commit
        required: true
        type: string
      image_url:
        description: Verified candidate module image
        required: true
        type: string
      image_tag:
        description: Candidate artifact tag
        required: true
        type: string
  workflow_call:
    inputs:
      source:
        required: true
        type: string
      image_url:
        required: true
        type: string
      image_tag:
        required: true
        type: string
permissions:
  contents: read
  pull-requests: write
  statuses: write
jobs:
  debian:
    uses: NethServer/ns8-github-actions/.github/workflows/test-on-qemu.yml@v1
    with:
      distro: debian13
      repo_ref: ${{ inputs.source }}
      image_url: ${{ inputs.image_url }}
      version_tag: ${{ inputs.image_tag }}
      script: ''
      args: '-v SCENARIO:update -v EXPECTED_SOURCE:${{ inputs.source }}'
      artifact_suffix: update
      run_ui_tests: false
      timeout_minutes: 90
  rocky:
    uses: NethServer/ns8-github-actions/.github/workflows/test-on-qemu.yml@v1
    with:
      distro: rocky9
      repo_ref: ${{ inputs.source }}
      image_url: ${{ inputs.image_url }}
      version_tag: ${{ inputs.image_tag }}
      script: ''
      args: '-v SCENARIO:install -v EXPECTED_SOURCE:${{ inputs.source }}'
      artifact_suffix: install
      run_ui_tests: true
      timeout_minutes: 90
