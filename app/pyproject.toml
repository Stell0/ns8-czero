[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "czero-app"
version = "0.54.0"
description = "C0 reference web application"
requires-python = ">=3.12,<3.15"
license = "GPL-3.0-or-later"
dependencies = [
    "czero-core>=0.34.0,<0.36.0",
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
    "python-multipart==0.0.32",
    "mcp==2.3.0",
    "httpcore==1.0.9",
    "certifi==2026.10.19",
]

[project.optional-dependencies]
test = ["httpx==0.28.1", "pytest==8.4.2", "jsonschema==4.26.0", "PyYAML==6.0.3"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
czero-core = { git = "https://github.com/Stell0/ns8-czero.git", tag = "core-v0.34.0", subdirectory = "packages/czero-core" }
