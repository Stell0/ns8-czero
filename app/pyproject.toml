[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "czero-app"
version = "0.7.1"
description = "C0 reference web application"
requires-python = ">=3.12,<3.15"
license = "GPL-3.0-or-later"
dependencies = [
    "czero-core==0.6.1",
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
test = ["httpx==0.28.1", "pytest==8.4.2", "jsonschema==4.26.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
czero-core = { path = "../packages/czero-core", editable = false }
